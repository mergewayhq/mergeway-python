name: Python CI and Release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  UV_CACHE_DIR: .cache/uv

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore Nix cache
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: devenv-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.yaml', 'devenv.lock') }}
          restore-prefixes-first-match: |
            devenv-${{ runner.os }}-
          gc-max-store-size-linux: 2G

      - name: Use devenv Cachix cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        shell: bash
        run: nix profile install nixpkgs#devenv

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: .cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Warm devenv shell
        shell: devenv shell bash -- -e {0}
        run: |
          true

      - name: Run unit tests
        run: devenv shell -- bash -euo pipefail -c 'uv run python -m unittest'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: devenv shell bash -- -e {0}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -nE 's/^version = \"([^\"]+)\"$/\1/p' pyproject.toml)"
          test "$tag_version" = "$package_version"

      - name: Build distributions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: devenv shell bash -- -e {0}
        run: |
          rm -rf dist
          uv run --with build python -m build

      - name: Upload distributions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mergeway
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
