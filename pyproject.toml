[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeway"
version = "0.1.0"
description = "Python automation wrapper for Mergeway repositories"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "plumbum>=1.9,<2",
]

[project.scripts]
mergeway-python = "mergeway.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

